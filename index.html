<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미니 테트리스</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b31;--line:#273451;--text:#eef3ff;--muted:#96a5c4;--accent:#7c9cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a2850 0%,var(--bg) 58%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
.app{width:min(900px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:0;letter-spacing:-.06em}header p{margin:5px 0 0;color:var(--muted);font-size:.95rem}.tag{border:1px solid #3b4b71;color:#bdcbff;padding:7px 11px;border-radius:999px;font-size:.78rem;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:start}.board-wrap,.side-card{background:#11192b;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px #0004}.board-wrap{padding:14px;position:relative;max-width:480px;margin:auto;width:100%}canvas{display:block;width:100%;height:auto;border-radius:10px;background:#090e1b}.overlay{position:absolute;inset:14px;display:grid;place-items:center;background:#080d18b8;border-radius:10px;text-align:center;padding:20px}.overlay.hidden{display:none}.overlay h2{margin:0 0 8px;font-size:1.8rem}.overlay p{color:#c0cbe2;margin:0 0 18px}.btn{border:0;border-radius:11px;padding:11px 16px;background:var(--accent);color:#071027;font-weight:800;cursor:pointer;font-size:.95rem}.btn:hover{filter:brightness(1.1)}.side{display:grid;gap:12px}.side-card{padding:16px}.label{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.value{font-size:1.8rem;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.next-box{display:flex;justify-content:center;margin-top:8px}#next{width:128px;height:128px;background:#090e1b;border-radius:10px}.controls{font-size:.86rem;color:#b7c4df;line-height:1.9}.key{display:inline-block;min-width:25px;text-align:center;padding:1px 6px;border:1px solid #3b4a69;border-radius:5px;color:#edf2ff;background:#1a2540;font-size:.76rem}.side .btn{width:100%;margin-top:10px}.mobile-controls{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.mobile-controls button{padding:13px 5px;background:#1a2540;border:1px solid #334465;color:white;border-radius:10px;font-size:1.1rem;touch-action:manipulation}
footer{text-align:center;color:#6f7f9f;font-size:.8rem;margin-top:18px}
@media(max-width:680px){body{padding:15px}.layout{grid-template-columns:minmax(0,1fr);gap:12px}.board-wrap{max-width:390px}.side{grid-template-columns:1fr 1fr}.side-card.controls-card{grid-column:1/-1}.side-card{padding:13px}.mobile-controls{display:grid}.value{font-size:1.45rem}.next-box{margin-top:4px}#next{width:100px;height:100px}header{align-items:flex-start}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>MINI TETRIS</h1><p>블록을 쌓고, 한 줄씩 지워 보세요.</p></div><span class="tag">CLASSIC · 10 × 20</span></header>
<div class="layout">
<section class="board-wrap" aria-label="테트리스 게임판">
<canvas id="board" width="300" height="600" aria-label="게임 보드"></canvas>
<div id="overlay" class="overlay"><div><h2 id="overlay-title">준비됐나요?</h2><p id="overlay-text">시작 버튼을 눌러 게임을 시작하세요.</p><button id="start" class="btn">게임 시작</button></div></div>
</section>
<aside class="side">
<div class="side-card"><div class="stats"><div><div class="label">점수</div><div id="score" class="value">0</div></div><div><div class="label">최고 점수</div><div id="best" class="value">0</div></div><div><div class="label">지운 줄</div><div id="lines" class="value">0</div></div><div><div class="label">레벨</div><div id="level" class="value">1</div></div></div></div>
<div class="side-card"><div class="label">다음 블록</div><div class="next-box"><canvas id="next" width="128" height="128"></canvas></div><button id="pause" class="btn" style="background:#263653;color:#eef3ff" disabled>일시정지</button></div>
<div class="side-card controls-card"><div class="label">조작 방법</div><div class="controls"><span class="key">←</span> <span class="key">→</span> 이동<br><span class="key">↑</span> 회전<br><span class="key">↓</span> 빠르게 내리기<br><span class="key">Space</span> 즉시 내리기<br><span class="key">P</span> 일시정지</div></div>
</aside>
</div>
<div class="mobile-controls" aria-label="모바일 조작"><button data-action="left" aria-label="왼쪽">←</button><button data-action="rotate" aria-label="회전">↻</button><button data-action="right" aria-label="오른쪽">→</button><button data-action="drop" aria-label="내리기">⬇</button></div>
<footer>키보드와 모바일 버튼을 모두 지원합니다. 즐겁게 플레이하세요!</footer>
</main>
<script>
(() => {
const COLS=10, ROWS=20, CELL=30;
const boardCanvas=document.getElementById('board'), ctx=boardCanvas.getContext('2d');
const nextCanvas=document.getElementById('next'), nctx=nextCanvas.getContext('2d');
const COLORS={I:'#38d9e6',O:'#ffd166',T:'#b388ff',S:'#69e6a6',Z:'#ff6b88',J:'#6ea8ff',L:'#ff9f5a'};
const SHAPES={
 I:[[1,1,1,1]], O:[[1,1],[1,1]], T:[[0,1,0],[1,1,1]],
 S:[[0,1,1],[1,1,0]], Z:[[1,1,0],[0,1,1]],
 J:[[1,0,0],[1,1,1]], L:[[0,0,1],[1,1,1]]
};
let grid, piece, nextType, score=0, lines=0, level=1, running=false, paused=false, ended=false, dropCounter=0, lastTime=0, raf=0;
let best=0; try{best=Number(localStorage.getItem('mini-tetris-best')||0)}catch{}
const $=id=>document.getElementById(id);
function newPiece(type){return {type,shape:SHAPES[type].map(r=>r.slice()),x:Math.floor((COLS-SHAPES[type][0].length)/2),y:0};}
function randomType(){return Object.keys(SHAPES)[Math.floor(Math.random()*7)]}
function reset(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));score=0;lines=0;level=1;nextType=randomType();piece=newPiece(nextType);nextType=randomType();running=true;paused=false;ended=false;dropCounter=0;lastTime=0;$('overlay').classList.add('hidden');$('pause').disabled=false;$('pause').textContent='일시정지';updateStats();drawNext();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function updateStats(){ $('score').textContent=score.toLocaleString();$('best').textContent=Math.max(best,score).toLocaleString();$('lines').textContent=lines;$('level').textContent=level;}
function collides(p,dx=0,dy=0,shape=p.shape){for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++)if(shape[y][x]){let nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&grid[ny][nx])return true;}return false;}
function rotate(shape){return shape[0].map((_,i)=>shape.map(row=>row[i]).reverse());}
function move(dx){if(!running||paused||ended)return;if(!collides(piece,dx,0))piece.x+=dx;draw();}
function turn(){if(!running||paused||ended)return;const rotated=rotate(piece.shape);for(const kick of [0,-1,1,-2,2])if(!collides(piece,kick,0,rotated)){piece.x+=kick;piece.shape=rotated;break;}draw();}
function softDrop(){if(!running||paused||ended)return;if(!collides(piece,0,1)){piece.y++;score+=1;updateStats()}else lockPiece();dropCounter=0;draw();}
function hardDrop(){if(!running||paused||ended)return;let dist=0;while(!collides(piece,0,1)){piece.y++;dist++}score+=dist*2;lockPiece();draw();}
function lockPiece(){piece.shape.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.type;}));clearLines();piece=newPiece(nextType);nextType=randomType();drawNext();if(collides(piece)){gameOver();return;}updateStats();}
function clearLines(){let count=0;for(let y=ROWS-1;y>=0;){if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(COLS).fill(null));count++;}else y++;}if(count){lines+=count;score+=[0,100,300,500,800][count]*level;level=Math.floor(lines/10)+1;updateStats();}}
function gameOver(){running=false;ended=true;best=Math.max(best,score);try{localStorage.setItem('mini-tetris-best',String(best))}catch{}updateStats();showOverlay('게임 오버','점수 '+score.toLocaleString()+'점 · 다시 도전해 보세요.','다시 시작');}
function showOverlay(title,msg,button){$('overlay-title').textContent=title;$('overlay-text').textContent=msg;$('start').textContent=button;$('overlay').classList.remove('hidden');}
function togglePause(){if(ended||!running)return;paused=!paused;$('pause').textContent=paused?'계속하기':'일시정지';if(paused)showOverlay('일시정지','잠깐 쉬어 가세요.','계속하기');else{$('overlay').classList.add('hidden');lastTime=0;raf=requestAnimationFrame(loop)}}
function drawCell(c,x,y,size=CELL,alpha=1){c.globalAlpha=alpha;c.fillStyle=COLORS[x.type]||'#fff';c.fillRect(y*size+1,0,0,0);c.globalAlpha=1;}
function block(c,x,y,size,color){c.fillStyle=color;c.fillRect(x*size+1,y*size+1,size-2,size-2);c.fillStyle='#ffffff28';c.fillRect(x*size+2,y*size+2,size-4,3);c.fillStyle='#00000020';c.fillRect(x*size+2,y*size+size-5,size-4,3);}
function draw(){ctx.clearRect(0,0,300,600);ctx.fillStyle='#090e1b';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,600);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(300,y*CELL);ctx.stroke()}
grid.forEach((row,y)=>row.forEach((type,x)=>{if(type)block(ctx,x,y,CELL,COLORS[type])}));
if(piece){let ghost={...piece,y:piece.y};while(!collides(ghost,0,1))ghost.y++;ghost.shape.forEach((row,y)=>row.forEach((v,x)=>{if(v&&ghost.y+y>=0)block(ctx,piece.x+x,ghost.y+y,CELL,COLORS[piece.type]+'55')}));piece.shape.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)block(ctx,piece.x+x,piece.y+y,CELL,COLORS[piece.type])}));}}
function drawNext(){nctx.clearRect(0,0,128,128);nctx.fillStyle='#090e1b';nctx.fillRect(0,0,128,128);const s=SHAPES[nextType],size=24,ox=(128-s[0].length*size)/2,oy=(128-s.length*size)/2;s.forEach((r,y)=>r.forEach((v,x)=>{if(v){nctx.fillStyle=COLORS[nextType];nctx.fillRect(ox+x*size+1,oy+y*size+1,size-2,size-2);nctx.fillStyle='#ffffff28';nctx.fillRect(ox+x*size+2,oy+y*size+2,size-4,3)}}));}
function loop(time=0){if(!running||paused)return;const dt=time-lastTime;lastTime=time;dropCounter+=dt;const interval=Math.max(90,800-(level-1)*65);if(dropCounter>interval){if(!collides(piece,0,1))piece.y++;else lockPiece();dropCounter=0;}draw();if(running&&!paused)raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','p','P'].includes(e.key))e.preventDefault();if(e.key==='Enter'&&(ended||!running)){reset();return}if(e.key==='p'||e.key==='P'){togglePause();return}if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp')turn();if(e.key==='ArrowDown')softDrop();if(e.key===' ' )hardDrop();});
$('start').addEventListener('click',()=>{if(paused&&!ended){paused=false;$('pause').textContent='일시정지';$('overlay').classList.add('hidden');lastTime=0;raf=requestAnimationFrame(loop)}else reset()});
$('pause').addEventListener('click',togglePause);
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>({left:()=>move(-1),right:()=>move(1),rotate:turn,drop:hardDrop}[b.dataset.action])()));
// Use a short repeat for held mobile drop controls.
document.querySelector('[data-action="drop"]').addEventListener('contextmenu',e=>e.preventDefault());
grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));piece=null;draw();drawNext();updateStats();
})();
</script>
</body>
</html>
